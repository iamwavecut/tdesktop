name: Snap

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - '!changelog.txt'
      - '!LEGAL'
      - '!LICENSE'
      - '!.github/**'
      - '.github/workflows/snap.yml'
      - '.github/scripts/publish_release_asset.sh'
      - '!Telegram/build/**'
      - 'Telegram/build/version'
      - '!Telegram/Resources/uwp/**'
      - '!Telegram/Resources/winrc/**'
      - '!Telegram/SourceFiles/platform/win/**'
      - '!Telegram/SourceFiles/platform/mac/**'
      - '!Telegram/Telegram/**'
      - '!Telegram/configure.bat'
      - '!Telegram/Telegram.plist'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'dev' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  snap:
    name: Build and publish snap
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'release' || !endsWith(github.event.release.tag_name, '-dev') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Free up disk space
        uses: samueldr/more-space-action@97048bd0df83fb05b5257887bdbaffc848887673
        with:
          enable-remove-default-apt-patterns: false
          enable-lvm-span: true
          lvm-span-mountpoint: /var/lib/docker

      - name: Build snap
        run: |
          docker run --rm --privileged \
            -v "$PWD":/build \
            -w /build \
            canonical/snapcraft:8_core24 \
            snapcraft --verbosity=debug
          sudo chown -R "$USER:$USER" .

      - name: Find snap artifact
        run: |
          SNAP_FILE=$(echo forkgram_*.snap)
          echo "SNAP_FILE=$SNAP_FILE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SNAP_FILE }}
          path: ${{ env.SNAP_FILE }}

      - name: Publish GitHub release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'release' || github.event_name == 'push' }}
          RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'dev' || 'release' }}
        run: |
          export RELEASE_ASSET_PATH="$SNAP_FILE"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            export RELEASE_ASSET_NAME="Forkgram-linux-amd64.snap"
            export RELEASE_DELETE_ASSET_PATTERN="forkgram_*.snap"
          else
            export RELEASE_ASSET_NAME="$SNAP_FILE"
          fi
          export RELEASE_ASSET_LABEL="Snap package"
          bash .github/scripts/publish_release_asset.sh

      - name: Publish to Snap Store
        if: github.event_name != 'push'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: snapcraft upload "$SNAP_FILE" --release=stable
