name: MacOS Packaged.

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - '!changelog.txt'
      - '!LEGAL'
      - '!LICENSE'
      - '!.github/**'
      - '.github/workflows/mac_packaged.yml'
      - '.github/scripts/publish_release_asset.sh'
      - '!lib/xdg/**'
      - '!snap/**'
      - '!Telegram/build/**'
      - 'Telegram/build/version'
      - '!Telegram/Resources/uwp/**'
      - '!Telegram/Resources/winrc/**'
      - '!Telegram/SourceFiles/platform/win/**'
      - '!Telegram/SourceFiles/platform/linux/**'
      - '!Telegram/configure.bat'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - '!changelog.txt'
      - '!LEGAL'
      - '!LICENSE'
      - '!.github/**'
      - '.github/workflows/mac_packaged.yml'
      - '.github/scripts/publish_release_asset.sh'
      - '!lib/xdg/**'
      - '!snap/**'
      - '!Telegram/build/**'
      - 'Telegram/build/version'
      - '!Telegram/Resources/uwp/**'
      - '!Telegram/Resources/winrc/**'
      - '!Telegram/SourceFiles/platform/win/**'
      - '!Telegram/SourceFiles/platform/linux/**'
      - '!Telegram/configure.bat'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'dev' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:

  macos:
    name: MacOS
    runs-on: ${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/nightly') && 'depot-macos-latest' || 'macos-latest' }}

    strategy:
      matrix:
        defines:
          - ""

    env:
      GIT: "https://github.com"
      CMAKE_GENERATOR: "Ninja"
      CMAKE_BUILD_TYPE: "Release"
      CMAKE_BUILD_PARALLEL_LEVEL: ""
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CMAKE_PREFIX_PATH: "/opt/homebrew/opt/ffmpeg@6:/opt/homebrew/opt/openal-soft"
      RNNOISE: "d8ea2b0ec6a88f8a68d6904d75e33b4f09cb2987"
      WEBRTC: "89df288dd6ba5b2ec95b3c5eaf1e7e0c3a870fc4"
      TDE2E: "51743dfd01dff6179e2d8f7095729caa4e2222e9"
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      MANUAL_CACHING: "1"
      AUTO_CACHING: "1"

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          brew update
          brew upgrade || true
          brew install ada-url autoconf automake boost cmake ffmpeg@6 jpeg-xl libavif libheif libtool minizip ninja openal-soft openh264 openssl opus pkg-config python qtbase qtimageformats qtshadertools qtsvg xz
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake

          xcodebuild -version > CACHE_KEY.txt
          brew list --versions >> CACHE_KEY.txt
          echo $MANUAL_CACHING >> CACHE_KEY.txt
          echo "$GITHUB_WORKSPACE" >> CACHE_KEY.txt
          if [ "$AUTO_CACHING" = "1" ]; then
            thisFile=$REPO_NAME/.github/workflows/mac_packaged.yml
            echo `md5 -q $thisFile` >> CACHE_KEY.txt
          fi
          echo "CACHE_KEY=`md5 -q CACHE_KEY.txt`" >> $GITHUB_ENV

          echo "LibrariesPath=`pwd`" >> $GITHUB_ENV

      - name: RNNoise cache.
        id: cache-rnnoise
        uses: actions/cache@v5
        with:
          path: ${{ env.LibrariesPath }}/local/rnnoise
          key: ${{ runner.OS }}-rnnoise-${{ env.RNNOISE }}-${{ env.CACHE_KEY }}
      - name: RNNoise.
        if: steps.cache-rnnoise.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath

          git init rnnoise
          cd rnnoise
          git remote add origin $GIT/desktop-app/rnnoise.git
          git fetch --depth=1 origin $RNNOISE
          git reset --hard FETCH_HEAD
          ./autogen.sh
          ./configure --prefix=$LibrariesPath/local/rnnoise --disable-examples --disable-doc
          make -j$(sysctl -n hw.logicalcpu)
          make install

      - name: WebRTC cache.
        id: cache-webrtc
        uses: actions/cache@v5
        with:
          path: ${{ env.LibrariesPath }}/local/tg_owt
          key: ${{ runner.OS }}-webrtc-${{ env.WEBRTC }}-${{ env.CACHE_KEY }}
      - name: WebRTC.
        if: steps.cache-webrtc.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath

          git init tg_owt
          cd tg_owt
          git remote add origin $GIT/desktop-app/tg_owt.git
          git fetch --depth=1 origin $WEBRTC
          git reset --hard FETCH_HEAD
          git submodule update --init --recursive --depth=1

          cmake -Bbuild . \
            -DCMAKE_INSTALL_PREFIX=$LibrariesPath/local/tg_owt \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DTG_OWT_BUILD_AUDIO_BACKENDS=OFF
          cmake --build build
          cmake --install build

      - name: TDE2E cache.
        id: cache-tde2e
        uses: actions/cache@v5
        with:
          path: ${{ env.LibrariesPath }}/local/tde2e
          key: ${{ runner.OS }}-tde2e-${{ env.TDE2E }}-${{ env.CACHE_KEY }}
      - name: TDE2E.
        if: steps.cache-tde2e.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath

          git init tde2e
          cd tde2e
          git remote add origin $GIT/tdlib/td.git
          git fetch --depth=1 origin $TDE2E
          git reset --hard FETCH_HEAD

          cmake -Bbuild . \
            -DCMAKE_INSTALL_PREFIX=$LibrariesPath/local/tde2e \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET \
            -DTD_E2E_ONLY=ON
          cmake --build build
          cmake --install build

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd $REPO_NAME
          export CMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH$(find $LibrariesPath/local -mindepth 1 -maxdepth 1 -type d -exec printf ':%s' {} +)"

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=Telegram ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=Telegram" >> $GITHUB_ENV
          fi

          cmake -Bbuild . \
            -DTDESKTOP_API_TEST=ON \
            -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET \
            $DEFINE
          cmake --build build
          APP_BUNDLE="$(find build -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_BUNDLE" ]; then
            echo "No app bundle found in build."
            exit 1
          fi
          macdeployqt "$APP_BUNDLE"
          codesign --force --deep --sign - "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"

      - name: Package DMG.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          cd $REPO_NAME/build
          rm -rf artifact dmg-root
          mkdir artifact dmg-root
          APP_BUNDLE="$(find . -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_BUNDLE" ]; then
            echo "No app bundle found in build."
            exit 1
          fi
          cp -R "$APP_BUNDLE" "dmg-root/$(basename "$APP_BUNDLE")"
          ln -s /Applications dmg-root/Applications
          ARCH="$(uname -m)"
          DMG_NAME="Forkgram-macos-$ARCH.dmg"
          hdiutil create \
            -volname Forkgram \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "artifact/$DMG_NAME"
          echo "MACOS_RELEASE_ASSET_NAME=$DMG_NAME" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPO_NAME }}/build/artifact/

      - name: Publish GitHub release asset.
        if: env.UPLOAD_ARTIFACT == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
          RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'dev' || 'release' }}
        run: |
          cd "$REPO_NAME"
          export RELEASE_ASSET_PATH="build/artifact/$MACOS_RELEASE_ASSET_NAME"
          export RELEASE_ASSET_NAME="$MACOS_RELEASE_ASSET_NAME"
          export RELEASE_ASSET_LABEL="macOS $(uname -m) DMG"
          bash .github/scripts/publish_release_asset.sh
